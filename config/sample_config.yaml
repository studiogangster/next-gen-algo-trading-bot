# Sample configuration for the modular algo trading framework

symbols:
  - "738561"    # RELIANCE instrument token
  - "2953217"   # TCS instrument token
timeframes:
  - "1m"
  - "5m"
  - "30m"
  - "1h"

feed:
  type: "zerodha_ws"
  api_key: "${ZERODHA_API_KEY}"
  access_token: "${ZERODHA_ACCESS_TOKEN}"

broker:
  type: "zerodha"
  api_key: "${ZERODHA_API_KEY}"
  access_token: "${ZERODHA_ACCESS_TOKEN}"

storage:
  type: "parquet"
  base_dir: "data"

strategies:
  - type: "supertrend_rsi"
    params:
      rsi_length: 14
      supertrend_length: 10
      supertrend_multiplier: 3.0
  - type: "yaml_rule"
    params:
      name: "standard_signal_generator"
      quantity: 1
      dedupe_consecutive: true
      cooldown_bars: 2
      trade_target:
        instrument: "FUT"
        future_preference: "next"
        exchange: "NFO"
      indicators:
        - id: "rsi"
          type: "rsi"
          params:
            length: 14
        - id: "sma_fast"
          type: "sma"
          params:
            length: 20
      buy:
        all:
          - gt: ["rsi.value", 30]
          - gt: ["close", "sma_fast.value"]
      sell:
        any:
          - lt: ["rsi.value", 70]
          - lt: ["close", "sma_fast.value"]

dry_run: true
max_workers: 4
