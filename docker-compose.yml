services:
  redis:
    image: redis/redis-stack-server:latest
    restart: always
    expose:
      - 6379
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --protected-mode no
    # command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode" , "no"]
  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data

  candle-sync:
    image: ngat-runtime:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: candle-sync
    working_dir: /app
    shm_size: "2gb"
    volumes:
      - token-cache:/cache
    command: python -m cli.main start --config-path config/config.yaml
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TOKEN_CACHE_FILE=/cache/keystore.json
      - ENGINE_ENABLE_ORDER_SYNC=0
      - ENGINE_ENABLE_SYMBOL_SYNC=1
      - ENGINE_ENABLE_INDICATOR_SYNC=0
      - ENGINE_ENABLE_TIMEFRAME_SYNC=1
      - ENGINE_TIMEFRAME_SYNC_POLL_INTERVAL=5
      - ENGINE_TIMEFRAME_MAX_1M_POINTS_PER_CYCLE=1200
      - ENGINE_BOOTSTRAP_UNIVERSE=1
      - ENGINE_MAX_WORKERS=2
      - RAY_OBJECT_STORE_MEMORY_BYTES=134217728
      - RAY_memory_usage_threshold=0.99
      - RAY_memory_monitor_refresh_ms=0

  indicator-sync:
    image: ngat-runtime:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: indicator-sync
    working_dir: /app
    shm_size: "2gb"
    volumes:
      - token-cache:/cache
    command: python -m cli.main start --config-path config/config.yaml
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TOKEN_CACHE_FILE=/cache/keystore.json
      - ENGINE_ENABLE_ORDER_SYNC=0
      - ENGINE_ENABLE_SYMBOL_SYNC=0
      - ENGINE_ENABLE_INDICATOR_SYNC=1
      - ENGINE_ENABLE_TIMEFRAME_SYNC=0
      - ENGINE_BOOTSTRAP_UNIVERSE=0
      - ENGINE_MAX_WORKERS=1
      - RAY_OBJECT_STORE_MEMORY_BYTES=134217728
      - RAY_memory_usage_threshold=0.99
      - RAY_memory_monitor_refresh_ms=0
      - INDICATOR_SKIP_HISTORICAL_IF_PRESENT=0
      - INDICATOR_SYNC_VERBOSE=0

  order-sync:
    image: ngat-runtime:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: order-sync
    working_dir: /app
    volumes:
      - token-cache:/cache
    command: python -m cli.main start-order-sync --config-path config/config.yaml --poll-interval 0.5
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TOKEN_CACHE_FILE=/cache/keystore.json

  backend:
    image: ngat-runtime:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: backend
    working_dir: /app/tradingview_dashboard/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - INDICATORS_PRECOMPUTED_ONLY=1

  # frontend:
  #   image: node:20
  #   container_name: frontend
  #   working_dir: /
  #   volumes:
  #     - ./tradingview_dashboard/frontend:/src:ro
  #   command: >-
  #     /bin/bash -c "rm -rf /tmp/frontend-run &&
  #     mkdir -p /tmp/frontend-run &&
  #     cp -a /src/. /tmp/frontend-run/ &&
  #     cd /tmp/frontend-run &&
  #     npm install --no-audit --no-fund &&
  #     npm run dev -- --host 0.0.0.0"
  #   ports:
  #     - "5173:5173"
  #   environment:
